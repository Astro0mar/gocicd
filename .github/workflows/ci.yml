name: Go CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  IMAGE_NAME: go-cicd-demo
  GO_VERSION: "1.25"

jobs:

  # ==========================================
  # 1. GO TEST + BUILD
  # ==========================================
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check Go formatting
        run: |
          files=$(gofmt -l .)

          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            echo ""
            echo "Run locally:"
            echo "gofmt -w ."
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Unit tests with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Build
        run: go build -v -o bin/server ./cmd/server

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out


  # ==========================================
  # 2. SONARQUBE
  # ==========================================
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Generate coverage
        run: go test -coverprofile=coverage.out ./...

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ==========================================
  # 3. TRIVY FILESYSTEM SCAN
  # ==========================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true


  # ==========================================
  # 4. DOCKER BUILD + TRIVY IMAGE SCAN
  # ==========================================
  docker:
    name: Docker Build and Image Scan
    runs-on: ubuntu-latest
    needs: [test, trivy-fs]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # ==========================================
      # RHACS CLI
      # ==========================================
      - name: Install roxctl
        run: |
          curl -L \
            -o roxctl \
            https://mirror.openshift.com/pub/rhacs/assets/4.6.0/bin/Linux/roxctl

          chmod +x roxctl

          sudo mv roxctl /usr/local/bin/roxctl

          roxctl version

      - name: Save Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker save \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -o go-cicd-demo.tar

      - name: Upload Docker image artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: go-cicd-demo-image
          path: go-cicd-demo.tar
